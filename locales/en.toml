"La fenêtre cliquée prend le clavier et passe au premier plan. Le survol ne change rien ; la molette défile sous le pointeur." = "The clicked window takes the keyboard and comes to the front. Hovering changes nothing; the wheel scrolls under the pointer."
"La fenêtre sous la souris prend le clavier et passe au premier plan dès qu'on la survole." = "The window under the mouse takes the keyboard and comes to the front as soon as it is hovered."
"hyprdesk ne touche pas au focus : celui de Réglages → Clavier et souris s'applique aussi en plein bureau." = "hyprdesk leaves the focus alone: the one from Settings → Keyboard and mouse also applies on the full desktop."
"Le clic qui met une fenêtre au premier plan ne lui est pas transmis" = "The click that brings a window to the front is not passed on to it"
"Distance à parcourir avant de changer de fenêtre" = "Distance to travel before switching windows"
"Une application peut passer au premier plan d'elle-même" = "An application can come to the front by itself"
"Quand une fenêtre se ferme, le focus va à" = "When a window closes, the focus goes to"
"La fenêtre suivante" = "The next window"
"Celle sous le pointeur" = "The one under the pointer"
"La dernière utilisée" = "The last one used"
"hyprland | click | mouse — plein bureau : focus au clic, ou suivant la souris (hyprland : celui de Clavier et souris)" = "hyprland | click | mouse — full desktop: focus on click, or following the mouse (hyprland: the Keyboard and mouse one)"
"0..500 — plein bureau, focus suivant la souris : distance (px) avant de changer de fenêtre" = "0..500 — full desktop, focus following the mouse: distance (px) before switching windows"
"on | off — plein bureau, focus au clic : le clic qui met une fenêtre au premier plan ne lui est pas transmis" = "on | off — full desktop, focus on click: the click that brings a window to the front is not passed on to it"
"on | off — plein bureau : une application peut prendre le focus et passer devant d'elle-même" = "on | off — full desktop: an application can take the focus and come to the front by itself"
"next | cursor | recent — plein bureau : fenêtre qui prend le focus quand celle qui l'avait se ferme" = "next | cursor | recent — full desktop: the window that takes the focus when the one holding it closes"

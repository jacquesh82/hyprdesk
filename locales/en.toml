"\n## Agir sur hyprdesk\n\n- `hyprdesk config` : toutes les clés réglables, par paquet ; `hyprdesk config set <clé> <valeur>`\n- `hyprdesk settings <paquet>` : ouvre l'écran Réglages\n- `hyprdesk open <rôle>` : lance l'application par défaut d'un rôle\n- `hyprdesk status`, `hyprdesk check` : état du démon, vérification de la config\n" = "\n## Acting on hyprdesk\n\n- `hyprdesk config`: all settable keys, by package; `hyprdesk config set <key> <value>`\n- `hyprdesk settings <package>`: opens the Settings screen\n- `hyprdesk open <role>`: launches the default application for a role\n- `hyprdesk status`, `hyprdesk check`: daemon status, config check\n"
"\n## Applications par défaut\n\n" = "\n## Default applications\n\n"
"\n## Barre\n\n{pos}, hauteur {h}, écrans : {mon}.\n" = "\n## Bar\n\n{pos}, height {h}, screens: {mon}.\n"
"\n## Fichiers\n\n- `{p0}` : configuration écrite à la main (garde le dernier mot)\n- `{p1}` : réglages générés par l'écran Réglages et `hyprdesk config` (ne pas éditer)\n- `{p2}` : écrans, généré par hyprdesk (ne pas éditer)\n- `{p3}` : plugins Lua de widgets\n" = "\n## Files\n\n- `{p0}`: hand-written configuration (has the last word)\n- `{p1}`: settings generated by the Settings screen and `hyprdesk config` (do not edit)\n- `{p2}`: screens, generated by hyprdesk (do not edit)\n- `{p3}`: Lua widget plugins\n"

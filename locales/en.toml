"\n## Panorama (écrans bandeau tactiles)\n\nÉtat : écrans {screens} ; disposition `{layout}` ; profil du bloc `{profile}` ; pages après la vue par défaut : {pages} ; vidéo : {sources} ; musique : {music} ; LYRA vocale : {voice}.\n" = "\n## Panorama (touch strip screens)\n\nState: screens {screens}; layout `{layout}`; shortcuts block profile `{profile}`; pages after the default view: {pages}; video: {sources}; music: {music}; LYRA voice: {voice}.\n"
"\nTu peux tout piloter du Panorama. Réglages : `hyprdesk config set <clé> <valeur>` (liste : `hyprdesk config list panorama`) ; actions : `hyprdesk panorama …`.\n- Disposition : `panorama.layout` single | 1x2 | 1x3 | 2x2 | 3x3 | dashboard (composition, par défaut) ; `panorama.zones.<1x2|1x3|2x2|3x3>.panes <widget>,…` et `panorama.zones.<1x2|1x3>.first 1/2|1/3` ; `hyprdesk panorama layout <…>`, `hyprdesk panorama toggle|show|hide`.\n- Widgets : {widgets}, `playlist`, et `metric:<cpu|ram|gpu|vram|disk|load|uptime|cpu_temp|gpu_temp>[:gauges|cards]` (une mesure par tuile, en graphique par défaut).\n- Composition de la vue par défaut : `panorama.design.tiles` (JSON [{widget,x,y,w,h}], coordonnées 0 à 1) ; apparence : `panorama.design.*` (préréglage, couleurs, police, opacités, horloge, mesures…).\n- Pages du carrousel : `panorama.pages` (JSON [{name,tiles:[{widget,x,y,w,h}]}]) ; `hyprdesk panorama page <n|nom>` y va.\n- Bloc de raccourcis : `panorama.design.shortcut_profile` video | audio | system | power. Vidéo et Musique : composition fixe (menu, lecteur 16:9, colonne des services) ; `hyprdesk key <touche> [mods]` envoie une touche à la fenêtre active ; system (Raccourcis) : `panorama.design.shortcuts` (JSON [{name,icon,command}]) ; power (Système) : verrouiller, veille des écrans (`hyprdesk screens-off`, le volume les rallume : `idle_wake_volume`), veille, mise à jour (paquets et avancement), redémarrer, éteindre.\n- Sources : `panorama.sources` (vidéo), `panorama.music_sources`, `panorama.radios` (flux), en JSON [{name,url,icon,show}] ; show : auto (visible sans compte ou si l'on est connecté), on, off. `panorama.webradio` : radio-browser | radio-garden | radio-net | tunein. `hyprdesk panorama icons [sources|music|shortcuts|all] [--force]` : SmartUI dessine les icônes.\n- Lecteur (une seule source à la fois) : `hyprdesk panorama video <n|nom|close>` ; musique à la demande (« mets du jazz calme ») : choisis la recherche puis `hyprdesk panorama music <recherche>` (page de résultats de la plateforme active) ; `hyprdesk panorama radio <nom ou genre>` (première station de Radio Browser) ; `hyprdesk panorama open <adresse> [nom]` ; `hyprdesk panorama fullscreen` (vidéo seule) ; `hyprdesk media play-pause|next|previous|seek ±N`, `hyprdesk osd volume +5|-5|toggle`.\n- LYRA vocale : `panorama.voice` on | off (`hyprdesk panorama voice on|off`), `panorama.voice_mic` (nœud PipeWire ou default), `panorama.voice_halo` screens | panorama | off, `panorama.voice_halo_color` lyra | accent ; réglages dans IA → Voix (`hyprdesk settings assistant/voix`), module de barre `voice`. En demande vocale, réponds en une ou deux phrases courtes.\n- Une tuile de mesure touchée ouvre le gestionnaire des tâches (tri CPU, mémoire, GPU, VRAM, disque) ; `hyprdesk panorama tasks <cpu|ram|gpu|vram|disk|close>` l'ouvre ou le ferme.\n" = "\nYou can drive the whole Panorama. Settings: `hyprdesk config set <clé> <valeur>` (list: `hyprdesk config list panorama`); actions: `hyprdesk panorama …`.\n- Layout: `panorama.layout` single | 1x2 | 1x3 | 2x2 | 3x3 | dashboard (composition, default); `panorama.zones.<1x2|1x3|2x2|3x3>.panes <widget>,…` and `panorama.zones.<1x2|1x3>.first 1/2|1/3`; `hyprdesk panorama layout <…>`, `hyprdesk panorama toggle|show|hide`.\n- Widgets: {widgets}, `playlist`, and `metric:<cpu|ram|gpu|vram|disk|load|uptime|cpu_temp|gpu_temp>[:gauges|cards]` (one metric per tile, as a graph by default).\n- Default view composition: `panorama.design.tiles` (JSON [{widget,x,y,w,h}], coordinates 0 to 1); look: `panorama.design.*` (preset, colours, font, opacities, clock, metrics…).\n- Carousel pages: `panorama.pages` (JSON [{name,tiles:[{widget,x,y,w,h}]}]); `hyprdesk panorama page <n|name>` goes there.\n- Shortcuts block: `panorama.design.shortcut_profile` video | audio | system | power. Video and Music: fixed composition (menu, 16:9 player, services column); `hyprdesk key <key> [mods]` sends a key to the active window; system (Shortcuts): `panorama.design.shortcuts` (JSON [{name,icon,command}]); power (System): lock, screens off (`hyprdesk screens-off`, a volume change turns them back on: `idle_wake_volume`), suspend, update (packages and progress), restart, shut down.\n- Sources: `panorama.sources` (video), `panorama.music_sources`, `panorama.radios` (streams), as JSON [{name,url,icon,show}]; show: auto (visible without an account or when signed in), on, off. `panorama.webradio`: radio-browser | radio-garden | radio-net | tunein. `hyprdesk panorama icons [sources|music|shortcuts|all] [--force]` : SmartUI draws the icons.\n- Player (one source at a time): `hyprdesk panorama video <n|name|close>`; music on request (“play some calm jazz”): pick the search, then `hyprdesk panorama music <recherche>` (results page of the active platform); `hyprdesk panorama radio <name or genre>` (first Radio Browser station); `hyprdesk panorama open <url> [name]`; `hyprdesk panorama fullscreen` (video only); `hyprdesk media play-pause|next|previous|seek ±N`, `hyprdesk osd volume +5|-5|toggle`.\n- LYRA voice: `panorama.voice` on | off (`hyprdesk panorama voice on|off`), `panorama.voice_mic` (PipeWire node or default), `panorama.voice_halo` screens | panorama | off, `panorama.voice_halo_color` lyra | accent; settings in AI → Voice (`hyprdesk settings assistant/voix`), bar module `voice`. For a voice request, answer in one or two short sentences.\n- Tapping a metric tile opens the task manager (sort by CPU, memory, GPU, VRAM, disk); `hyprdesk panorama tasks <cpu|ram|gpu|vram|disk|close>` opens or closes it.\n"

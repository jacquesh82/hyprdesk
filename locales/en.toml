"Dans ma session Hyprland, le trousseau des applications (org.freedesktop.secrets) est tenu par {holder} au lieu du démon myMFA (mymfa.service, client Linux de myMFA), qui attend en file. Le coffre myMFA {vault}. Trouve ce qui lance {holder} (socket et service systemd --user, PAM de l'écran de connexion /etc/pam.d/greetd, démarrage automatique XDG, hyprland.lua…) et explique-le-moi. Puis propose la bascule vers myMFA sans perdre de secret : coffre créé et ouvert, import des secrets existants (mymfa import-gnome-keyring), arrêt et masquage de {holder}, et vérification avec mymfa status. Demande-moi avant de modifier quoi que ce soit, et ne touche jamais à inputs.lua ni à monitors.lua." = "In my Hyprland session, the application keyring (org.freedesktop.secrets) is held by {holder} instead of the myMFA daemon (mymfa.service, the myMFA Linux client), which is waiting in the queue. The myMFA vault {vault}. Find what starts {holder} (systemd --user socket and service, login screen PAM /etc/pam.d/greetd, XDG autostart, hyprland.lua…) and explain it to me. Then propose switching to myMFA without losing any secret: vault created and unlocked, existing secrets imported (mymfa import-gnome-keyring), {holder} stopped and masked, and a check with mymfa status. Ask me before changing anything, and never touch inputs.lua or monitors.lua."

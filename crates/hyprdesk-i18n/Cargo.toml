[package]
name = "hyprdesk-i18n"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "Langue de l'interface de hyprdesk (catalogue français → anglais, tr!)"
publish = false

[features]
# Langue source figée (tests de hyprdesk, qui lisent des textes français).
fixed-lang = []

[dependencies]
toml = "0.9"
chrono = { version = "0.4", features = ["unstable-locales"] }
tracing = "0.1"

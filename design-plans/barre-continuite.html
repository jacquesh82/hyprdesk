  <script>
    (() => {
      const root = document.getElementById('hyprdesk-continuite');
      const stage = root.querySelector('.hd-stage');
      const bar = root.querySelector('.hd-bar');
      const panel = root.querySelector('.hd-popover');
      const hover = root.querySelector('.hd-hover');
      const status = root.querySelector('#hd-continuite-status');
      const preferences = { accent:'#a69cff', height:44, motion:true };
      const titles = ['Design · hyprdesk','Écriture · Notes','Code · Terminal','Personnel · Navigateur'];
      const initial = window.openai?.widgetState?.privateContent || {};
      const state = { kind:'control', workspace:0, volume:64, brightness:72, wifi:true, bluetooth:true, quiet:false, mode:'full', device:'speakers', ...initial };
      if (!['control','sound','network','battery','calendar',null].includes(state.kind)) state.kind = 'control';
      if (!Number.isInteger(state.workspace) || state.workspace < 0 || state.workspace > 3) state.workspace = 0;
      let trigger = root.querySelector('[data-open="control"]');
      let animation;
      let closing = false;
      function save() {
        if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent:{direction:'Continuité', espace:state.workspace+1, menu:state.kind}, privateContent:{...state} }).catch(() => {});
      }
      const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;

      function range(key,label,value,glyph) { return `<div class="hd-setting"><label for="hd-${key}">${label}<output for="hd-${key}">${value} %</output></label><div class="hd-range-row">${icon(glyph)}<input id="hd-${key}" type="range" min="0" max="100" value="${value}" style="--hd-fill:${value}%" data-range="${key}"></div></div>`; }

      function content(kind) {
        if (kind==='control') return head('Centre de contrôle') + `<div class="hd-connections">${tile('wifi','Wi-Fi','Maison','wifi')}${tile('bluetooth','Bluetooth','Activé','bluetooth')}</div>` + range('brightness','Luminosité',state.brightness,'sun') + range('volume','Son',state.volume,'volume-2') + `<div class="hd-divider"></div>` + modes() + `<div class="hd-bottom"><span><b class="hd-status-dot"></b>Batterie · 86 %</span><span>hyprdesk</span></div>`;
        if (kind==='sound') return head('Son','Sortie audio') + range('volume','Volume',state.volume,'volume-2') + `<div class="hd-divider"></div><div class="hd-section-label">Écouter avec</div>` + [['speakers','Haut-parleurs','monitor'],['headphones','Casque Bluetooth','headphones']].map(([key,label,glyph])=>`<button type="button" class="hd-device cursor-interaction" data-device="${key}" aria-pressed="${state.device===key}"><span>${icon(glyph)}${label}</span>${state.device===key?icon('check'):''}</button>`).join('');
        if (kind==='network') return head('Réseau','Connexion de démonstration') + `<div class="hd-connections">${tile('wifi','Wi-Fi','Maison','wifi')}</div><div class="hd-device"><span>${icon('wifi')}Maison</span><small>${state.wifi?'Connecté':'Déconnecté'}</small></div><div class="hd-divider"></div><div class="hd-sub">${state.wifi?'Réseau privé · Signal excellent':'Le Wi-Fi est désactivé.'}</div>`;
        if (kind==='battery') return head('Batterie','86 % · Sur batterie') + `<div class="hd-section-label">Profil d’énergie</div><div class="hd-device"><span>${icon('leaf')}Équilibré</span>${icon('check')}</div><div class="hd-divider"></div><div class="hd-sub">Votre batterie fonctionne normalement.</div>`;
        if (kind==='calendar') {
          const cells = ['L','M','M','J','V','S','D'].map(d=>`<span class="hd-weekday">${d}</span>`).join('') + '<span></span>'.repeat(6) + Array.from({length:30},(_,i)=>`<span${i===12?' class="hd-today" aria-label="Vendredi 13 novembre, aujourd’hui"':''}>${i+1}</span>`).join('');
          return head('Vendredi 13 novembre') + `<div class="hd-month">Novembre 2026</div><div class="hd-calendar" aria-label="Novembre 2026">${cells}</div>`;
        }
        return '';
      }
      function updateWorkspace() {
        const buttons = [...root.querySelectorAll('[data-workspace]')];
        buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===state.workspace)));
        root.querySelector('.hd-workspace-pill').style.transform = `translateX(${buttons[state.workspace].offsetLeft}px)`;
        root.querySelector('.hd-window-title').textContent = titles[state.workspace];
      }
      function updateBar() {
        root.querySelectorAll('[data-open]').forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.open===state.kind && !closing)));

      }
      function positionPanel() {
        if (!state.kind || state.kind==='calendar') return;
        const button = root.querySelector(`[data-open="${state.kind}"]`);
        const a = button.getBoundingClientRect(), b = stage.getBoundingClientRect();

        const left = Math.max(14, Math.min(a.right-b.left-width, b.width-width-14));
        panel.style.right = `${Math.max(14,b.width-left-width)}px`;
        panel.style.setProperty('--hd-origin',`${Math.max(16,Math.min(width-16,a.left+a.width/2-b.left-left))}px`);
      }
      function renderPanel() { panel.dataset.kind=state.kind||'control'; panel.innerHTML=content(state.kind); panel.setAttribute('aria-label',({control:'Centre de contrôle',sound:'Son',network:'Réseau',battery:'Batterie',calendar:'Calendrier'})[state.kind]||'Menu'); panel.hidden=!state.kind; enhance(); positionPanel(); updateBar(); }

        if (!reduced()) {
          const box=panel.getBoundingClientRect();
          const dx=wasOpen ? Math.max(-90,Math.min(90,oldBox.left-box.left)) : 0;
          const frames = wasOpen && previous!==kind ? [{opacity:.78,transform:`translateX(${dx}px) scale(.99)`},{opacity:1,transform:'translateX(0) scale(1)'}] : [{opacity:0,transform:'translateY(-6px) scale(.975)'},{opacity:1,transform:'translateY(0) scale(1)'}];
          animation=panel.animate(frames,{duration:wasOpen?160:180,easing:'cubic-bezier(.2,.8,.2,1)'});
        }
        save();
      }
      function close(returnFocus=false) {
        if(!state.kind) return;
        if(animation) animation.cancel();
        closing=true; state.kind=null; updateBar(); save();
        const finish=()=>{ if(!closing) return; panel.hidden=true; closing=false; if(returnFocus) trigger?.focus(); };
        if(reduced()) finish();
        else { animation=panel.animate([{opacity:1,transform:'translateY(0) scale(1)'},{opacity:0,transform:'translateY(-3px) scale(.985)'}],{duration:120,easing:'ease-in',fill:'forwards'}); animation.finished.then(finish).catch(()=>{}); }
      }
      root.addEventListener('click',e=>{
        const button=e.target.closest('button');
        if(!button) { if(!panel.contains(e.target) && !bar.contains(e.target)) close(); return; }
        if(button.hasAttribute('data-open')) { const kind=button.dataset.open; if(kind===state.kind) close(); else show(kind,button); if(e.detail===0) panel.querySelector('button,input')?.focus(); }
        if(button.hasAttribute('data-close')) close(true);
        if(button.hasAttribute('data-workspace')) { state.workspace=Number(button.dataset.workspace); updateWorkspace(); status.textContent=`Espace ${state.workspace+1} · ${titles[state.workspace]}`; close(); save(); }
        if(button.hasAttribute('data-toggle')) { const key=button.dataset.toggle; state[key]=!state[key]; button.setAttribute('aria-pressed',String(state[key])); button.querySelector('small').textContent=state[key]?(key==='wifi'?'Maison':'Activé'):'Désactivé'; if(state.kind==='network') renderPanel(); save(); }
        if(button.hasAttribute('data-mode')) { state.mode=button.dataset.mode; panel.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode))); root.querySelector('.hd-desktop-caption').hidden=state.mode!=='full'; save(); }
        if(button.hasAttribute('data-device')) { state.device=button.dataset.device; renderPanel(); panel.querySelector(`[data-device="${state.device}"]`).focus(); save(); }
      });
      root.addEventListener('input',e=>{ if(e.target.dataset.range) { const key=e.target.dataset.range; state[key]=Number(e.target.value); e.target.style.setProperty('--hd-fill',`${state[key]}%`); e.target.closest('.hd-setting').querySelector('output').textContent=`${state[key]} %`; updateBar(); } });
      root.addEventListener('change',e=>{ if(e.target.dataset.range) save(); });
      root.addEventListener('keydown',e=>{ if(e.key==='Escape' && state.kind) { e.preventDefault(); close(true); } });
      bar.addEventListener('pointerover',e=>{ const b=e.target.closest('.hd-bar-button'); if(!b) return; const x=b.getBoundingClientRect(), y=bar.getBoundingClientRect(); hover.style.width=`${x.width}px`; hover.style.transform=`translateX(${x.left-y.left}px)`; hover.style.top=`${x.top-y.top}px`; hover.style.opacity='1'; });
      bar.addEventListener('pointerleave',()=>hover.style.opacity='0');
      function applyPreferences() { root.style.setProperty('--hd-accent',preferences.accent); root.style.setProperty('--hd-bar-height',`${preferences.height}px`); root.dataset.still=String(!preferences.motion); if(!preferences.motion && animation) animation.finish(); updateWorkspace(); positionPanel(); }
      new ResizeObserver(()=>{updateWorkspace();positionPanel();}).observe(stage);
      window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent; if(saved) {Object.assign(state,saved); renderPanel();root.querySelector('.hd-desktop-caption').hidden=state.mode!=='full';}});
      renderPanel();
      root.querySelector('.hd-desktop-caption').hidden=state.mode!=='full';
      if(globalThis.Tweak) { const tweak=new Tweak({container:root,onChange:applyPreferences}); tweak.addColorPicker(preferences,'accent',{label:'Accent iris',reference:'--hd-accent'}); tweak.addSlider(preferences,'height',{label:'Hauteur de la barre',min:36,max:48,step:2,unit:'px'}); tweak.addToggle(preferences,'motion',{label:'Mouvements'}); }
    })();
  </script>
</div>

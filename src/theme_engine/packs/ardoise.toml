[meta]
id = "ardoise"
name = "Ardoise"
version = "1.1.0"
description = "Verre fumé, accent iris — le préréglage par défaut de hyprdesk."
license = "GPL-3.0-or-later"
authors = ["hyprdesk"]
default_variant = "dark"
min_engine = "0.1.9"

[palette]
bg = "#171b27"
fg = "#f2f4fc"

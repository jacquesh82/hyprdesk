[effects.bar]
opacity = 0.72
blur = true

[effects.menus]
opacity = 0.9
blur = true

[effects.launcher]
opacity = 0.88
blur = true

[effects.settings]
opacity = 0.97
blur = true

[effects.widgets]
opacity = 0.84
blur = false

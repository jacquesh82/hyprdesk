name: Vérifications
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Lancement à la main : Actions → Vérifications → Run workflow. Le job
  # packages construit deb, rpm et pkg.tar.zst et les dépose en artefacts du
  # run (sans release ni commit) — pour tester un paquet sans couper un tag.
  workflow_dispatch:
jobs:
  # Branches et pull requests seulement : un tag v* pointe un commit déjà
  # vérifié par le push ou la PR qui l'a produit, il ne relance donc ni rust ni
  # shellcheck — seuls les jobs packages (et release sur tag) s'exécutent là.
  rust:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      # Mêmes paquets que le job packages : libpam0g-dev (liaison PAM de
      # src/lock/pam.rs) et libssl-dev manquent sur le runner Ubuntu nu.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev libegl1-mesa-dev dbus-x11 libpam0g-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/verify.sh
  shellcheck:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh
  packages:
    # Sur un tag v* : les paquets alimentent la release GitHub et le sha256
    # committé dans le PKGBUILD. Sur un lancement à la main
    # (Actions → Run workflow) : les mêmes paquets sont déposés en artefacts
    # du run, sans toucher à la release ni au PKGBUILD.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : le checkout est détaché sur le tag, et le hash
          # du PKGBUILD est committé sur main juste après (git checkout main).
          # La version des paquets vient de Cargo.toml, pas de git describe.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      # Mêmes paquets que le job rust, plus ceux que scripts/package.sh réclame
      # (via scripts/deps.sh : libpam0g-dev, libssl-dev) et binutils (objdump,
      # strip, pour la version glibc). nfpm tourne dans son image Docker
      # (goreleaser/nfpm:v2.48.0), déjà disponible sur le runner.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev libegl1-mesa-dev dbus-x11 libpam0g-dev libssl-dev binutils
      - uses: Swatinem/rust-cache@v2
      - run: MAINTAINER="Jacques HULLU <jacquesh82@users.noreply.github.com>" bash scripts/package.sh deb rpm arch
      # Lancement à la main : les paquets en artefacts du run (90 jours).
      - name: "Artefacts du run (deb, rpm, arch)"
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: hyprdesk-${{ github.sha }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error
      - name: Empreinte du tarball du tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          HASH="$(curl -fsSL "https://github.com/jacquesh82/hyprdesk/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | awk '{print $1}')"
          echo "Tarball ${GITHUB_REF_NAME}.tar.gz : sha256 $HASH"
          echo "HASH=$HASH" >> "$GITHUB_ENV"
      - name: "PKGBUILD et .SRCINFO : sha256 committé sur main"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "hyprdesk-ci"
          git config user.email "hyprdesk-ci@users.noreply.github.com"
          git checkout main
          git pull --ff-only
          sed -i "s/^sha256sums=('.*')$/sha256sums=('$HASH')/" packaging/arch/PKGBUILD
          # .SRCINFO (lu par l'AUR) suit le PKGBUILD.
          sed -i "s/^\tsha256sums = .*/\tsha256sums = $HASH/" packaging/arch/.SRCINFO
          git add packaging/arch/PKGBUILD packaging/arch/.SRCINFO
          git commit -m "arch : sha256 du tarball ${GITHUB_REF_NAME} (job release)"
          git push
      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm dist/*.pkg.tar.zst --title "hyprdesk ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}

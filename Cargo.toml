[package]
name = "hyprdesk"
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "Bureau à la demande pour Hyprland : fond d'écran, icônes et widgets par workspace, configuré en Lua"
repository = "https://github.com/jacquesh82/hyprdesk"
publish = false
default-run = "hyprdesk"

# Une bibliothèque, plusieurs binaires : chacun ne lie que ce qu'il atteint.
# L'écran de verrouillage, l'écran de connexion et l'agent polkit (code
# d'authentification) n'embarquent ni le démon, ni Lua, ni l'index.
[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "hyprdesk"
path = "src/main.rs"

[[bin]]
name = "hyprdesk-lock"
path = "src/bin/hyprdesk-lock.rs"

[[bin]]
name = "hyprdesk-greeter"
path = "src/bin/hyprdesk-greeter.rs"

[[bin]]
name = "hyprdesk-polkit"
path = "src/bin/hyprdesk-polkit.rs"

[[bin]]
name = "hyprdesk-theme-engine"
path = "src/bin/hyprdesk-theme-engine.rs"

[workspace]
# Crates du dépôt ; vendor/ reste hors de l'espace de travail (copies
# vérifiées de crates.io, branchées par [patch.crates-io]).
members = ["crates/hyprdesk-i18n", "crates/hyprdesk-auth", "crates/hyprdesk-theme-client"]
exclude = ["vendor"]

[dependencies]
# Langue et authentification, en crates à part (voir crates/).
hyprdesk-i18n = { path = "crates/hyprdesk-i18n" }
hyprdesk-auth = { path = "crates/hyprdesk-auth" }
# Couple iced / iced_layershell : iced_layershell 0.19 suit iced 0.14.
# winit-core est épinglé en 0.31.0-beta.2 dans Cargo.lock : la beta.4 casse
# iced_exdevtools (énumération NativeKeyCode devenue non exhaustive).
iced_layershell = "0.19.1"
# Écran de verrouillage (ext-session-lock-v1), même famille que iced_layershell.
iced_sessionlock = "0.19.1"
sessionlockev = "0.19.1"
# Liaison PAM écrite à la main (src/lock/pam.rs).
libc = "0.2"
# Couleurs par écran : tables gamma (wlr-gamma-control), mêmes versions que layershellev.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["client"] }
iced = { version = "0.14", features = ["advanced", "canvas", "image", "svg", "tokio", "markdown"] }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# IPC Hyprland partagé avec mindlog.hyprland_tools (MIT), épinglé sur un commit poussé.
hyprpanel-core = { version = "0.1.0", git = "https://github.com/jacquesh82/mindlog.hyprland_tools", rev = "275671f" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process", "sync", "fs", "signal"] }
notify = "8.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "ico", "bmp"] }
sysinfo = "0.40"
zbus = { version = "5", default-features = false, features = ["tokio"] }
freedesktop-icons = "0.4"
chrono = { version = "0.4", features = ["unstable-locales"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Décodage des QR (fenêtre myMFA, Scanner — MLG-46).
rqrr = "0.11"
# Cast vers la zone vidéo (MLG-217, MLG-218) : QR code de la page du
# téléphone, socket SSDP partagée (SO_REUSEPORT) du récepteur DIAL.
qrcode = { version = "0.14", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
toml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
ignore = "0.4.34"
flate2 = "1.1.11"
regex = "1.13.1"
zeroize = "1.9.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }

# Glisser-déposer vers le bureau : layershellev 0.19.1 ne gère pas le
# « data device » de Wayland. Copies locales complétées (vendor/*/HYPRDESK.md) ;
# à reporter lors d'une mise à jour d'iced_layershell.
[patch.crates-io]
layershellev = { path = "vendor/layershellev" }
iced_layershell = { path = "vendor/iced_layershell" }
# Ouverture des tiroirs : iced_wgpu et iced_tiny_skia rechargeaient toutes
# les polices du système pour chaque nouvelle surface (cache SVG par moteur
# de rendu). Base de polices commune au processus (MLG-156).
iced_wgpu = { path = "vendor/iced_wgpu" }
# Chiffres tabulaires (MLG-274) : `to_attributes` active `tnum` pour une
# famille suffixée de `TABULAR_SUFFIX`.
iced_graphics = { path = "vendor/iced_graphics" }
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
# Écran de verrouillage noir au réveil : la surface n'était jamais
# reconfigurée après un échec de présentation (MLG-175).
iced_sessionlock = { path = "vendor/iced_sessionlock" }
# Verrou refusé par le compositeur (`finished`) : sortir au lieu d'attendre
# pour toujours en gardant le verrou d'instance (session jamais reverrouillée).
sessionlockev = { path = "vendor/sessionlockev" }

[dev-dependencies]
# Tests : langue source figée (ils lisent des textes français).
hyprdesk-i18n = { path = "crates/hyprdesk-i18n", features = ["fixed-lang"] }
# Fin de chaîne du moteur de thème : la palette publiée relue par la cliente.
hyprdesk-theme-client = { path = "crates/hyprdesk-theme-client" }

# Binaires sans table de symboles : 88 → 69 Mo pour hyprdesk, sans coût de
# compilation (les paquets les strippaient déjà). Les traces de panique
# perdent les noms de fonctions.
[profile.release]
strip = "symbols"

# Paquets (scripts/package.sh, PKGBUILD) : LTO complet, une seule unité de
# compilation (environ −25 % ; compilation bien plus longue).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[package]
name = "hyprdesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Bureau à la demande pour Hyprland : fond d'écran, icônes et widgets par workspace, configuré en Lua"
repository = "https://github.com/jacquesh82/mindlog.hyprland_desktop"

[dependencies]
# Couple iced / iced_layershell : iced_layershell 0.19 suit iced 0.14.
# winit-core est épinglé en 0.31.0-beta.2 dans Cargo.lock : la beta.4 casse
# iced_exdevtools (énumération NativeKeyCode devenue non exhaustive).
iced_layershell = "0.19.1"
# Écran de verrouillage (ext-session-lock-v1), même famille que iced_layershell.
iced_sessionlock = "0.19.1"
# Liaison PAM écrite à la main (src/lock/pam.rs).
libc = "0.2"
iced = { version = "0.14", features = ["advanced", "image", "svg", "tokio", "markdown"] }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# IPC Hyprland partagé avec mindlog.hyprland_tools (MIT), épinglé sur un commit poussé.
hyprpanel-core = { git = "https://github.com/jacquesh82/mindlog.hyprland_tools", rev = "275671f" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process", "sync", "fs", "signal"] }
notify = "8.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sysinfo = "0.40"
zbus = { version = "5", default-features = false, features = ["tokio"] }
freedesktop-icons = "0.4"
chrono = { version = "0.4", features = ["unstable-locales"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"

# Glisser-déposer vers le bureau : layershellev 0.19.1 ne gère pas le
# « data device » de Wayland. Copies locales complétées (vendor/*/HYPRDESK.md) ;
# à reporter lors d'une mise à jour d'iced_layershell.
[patch.crates-io]
layershellev = { path = "vendor/layershellev" }
iced_layershell = { path = "vendor/iced_layershell" }
